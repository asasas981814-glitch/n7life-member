<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N7LiFe 會員專屬服務系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #090d16;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .aurora-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
            background: radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.35), transparent 45%),
                        radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.35), transparent 45%),
                        radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.3), transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(99, 102, 241, 0.3), transparent 45%);
            filter: blur(60px);
            animation: auroraAnimation 12s ease-in-out infinite alternate;
        }
        @keyframes auroraAnimation {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(3deg); }
            100% { transform: scale(1.05) rotate(-3deg); }
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .btn-neon {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #ec4899 100%);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }
        .neon-text-purple { text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
        .neon-text-cyan { text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-3 relative">

    <div class="aurora-bg"></div>

    <div id="app-container" class="w-full max-w-md glass-card rounded-3xl overflow-hidden flex flex-col min-h-[88vh] relative z-10">
        <div id="main-view" class="flex-1 flex flex-col">
            <div class="flex-1 flex items-center justify-center p-8 text-indigo-200/60">連接雲端資料庫中...</div>
        </div>
    </div>

    <!-- 轉單物流填寫彈跳視窗 Modal -->
    <div id="shipping-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-purple-500/30 w-full max-w-sm rounded-3xl p-6 shadow-2xl relative">
            <h3 class="text-base font-bold text-white mb-1 flex items-center gap-2">
                📦 填寫轉單寄送資訊
            </h3>
            <p id="modal-prize-title" class="text-xs text-purple-300 mb-4 font-medium"></p>
            
            <input type="hidden" id="modal-prize-index">

            <div class="space-y-3 mb-5">
                <div>
                    <label class="text-xs font-medium text-indigo-200/80">選擇物流方式</label>
                    <select id="shipping-method" onchange="handleShippingMethodChange()" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                        <option value="賣貨便" class="bg-slate-900">7-11 賣貨便</option>
                        <option value="店到店" class="bg-slate-900">7-11 / 全家 店到店</option>
                        <option value="宅配" class="bg-slate-900">黑貓/郵局 宅配</option>
                    </select>
                </div>

                <div id="field-c2c" class="shipping-fields">
                    <label class="text-xs font-medium text-indigo-200/80">賣貨便取貨代碼 / 訂單編號</label>
                    <input type="text" id="ship-c2c-code" placeholder="請輸入賣貨便單號" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                </div>

                <div id="field-store" class="shipping-fields hidden space-y-3">
                    <div>
                        <label class="text-xs font-medium text-indigo-200/80">收件人姓名</label>
                        <input type="text" id="ship-store-name" placeholder="請輸入真實姓名" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-indigo-200/80">收件人手機電話</label>
                        <input type="tel" id="ship-store-phone" placeholder="09xxxxxxxx" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-indigo-200/80">取貨超商門市名稱 / 店號</label>
                        <input type="text" id="ship-store-branch" placeholder="例如: 7-11/全家 XXXXX店" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                    </div>
                </div>

                <div id="field-home" class="shipping-fields hidden space-y-3">
                    <div>
                        <label class="text-xs font-medium text-indigo-200/80">收件人姓名</label>
                        <input type="text" id="ship-home-name" placeholder="請輸入真實姓名" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-indigo-200/80">收件人手機電話</label>
                        <input type="tel" id="ship-home-phone" placeholder="09xxxxxxxx" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-indigo-200/80">完整收件地址</label>
                        <input type="text" id="ship-home-address" placeholder="請輸入縣市區及詳細地址" class="w-full mt-1 px-3 py-2.5 glass-input rounded-xl text-sm outline-none">
                    </div>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="closeShippingModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white py-2.5 rounded-xl text-xs font-bold transition">取消</button>
                <button onclick="submitShippingInfo()" class="flex-1 btn-neon text-white py-2.5 rounded-xl text-xs font-bold transition">確認送出轉單</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sanuaxbkzuvpgrfddodb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9sgAfywutJsCQqyQWu9Thw_fL7WlEph';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserPhone = localStorage.getItem('sys_current_user') || null;
        let currentMemberData = null;

        async function loadUserData() {
            if (!currentUserPhone) return;
            const { data, error } = await _supabase
                .from('members')
                .select('*')
                .eq('phone', currentUserPhone)
                .single();
            
            if (data) {
                currentMemberData = data;
            } else {
                currentUserPhone = null;
                localStorage.removeItem('sys_current_user');
            }
        }

        async function render() {
            if (currentUserPhone) {
                await loadUserData();
            }
            const view = document.getElementById('main-view');
            if (currentUserPhone && currentMemberData) {
                view.innerHTML = renderMemberDashboard();
            } else {
                view.innerHTML = renderAuthView();
            }
        }

        function renderAuthView() {
            return `
                <div class="flex-1 flex flex-col justify-center p-6">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-gradient-to-tr from-purple-600 via-indigo-500 to-pink-500 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-purple-500/30 border border-white/20 mb-3">N7</div>
                        <h1 class="text-2xl font-bold text-white neon-text-purple tracking-wide">N7LiFe 會員系統</h1>
                        <p class="text-xs text-indigo-200/70 mt-1">會員錢包與賞品櫃管理系統</p>
                    </div>

                    <div class="bg-slate-900/40 p-6 rounded-3xl border border-white/10 backdrop-blur-md">
                        <div id="login-form">
                            <h2 class="text-base font-bold text-purple-200 mb-4 flex items-center gap-1.5">
                                <span class="w-2 h-2 bg-purple-400 rounded-full animate-ping"></span> 會員登入
                            </h2>
                            <div class="space-y-3 mb-5">
                                <div>
                                    <label class="text-xs font-medium text-indigo-200/80">手機號碼</label>
                                    <input type="tel" id="login-phone" placeholder="09xxxxxxxx" class="w-full mt-1 px-4 py-2.5 glass-input rounded-xl text-sm outline-none transition">
                                </div>
                                <div>
                                    <label class="text-xs font-medium text-indigo-200/80">密碼</label>
                                    <input type="password" id="login-pwd" placeholder="請輸入密碼" class="w-full mt-1 px-4 py-2.5 glass-input rounded-xl text-sm outline-none transition">
                                </div>
                            </div>
                            <button onclick="handleLogin()" class="w-full btn-neon text-white py-3 rounded-xl font-medium text-sm transition">登入系統</button>
                            <p class="text-center text-xs text-indigo-200/60 mt-4">還沒有帳號？ <button onclick="switchAuthMode('register')" class="text-pink-400 font-medium">立即註冊</button></p>
                        </div>

                        <div id="register-form" class="hidden">
                            <h2 class="text-base font-bold text-pink-200 mb-4 flex items-center gap-1.5">
                                <span class="w-2 h-2 bg-pink-400 rounded-full animate-ping"></span> 新會員註冊
                            </h2>
                            <div class="space-y-3 mb-5">
                                <div>
                                    <label class="text-xs font-medium text-indigo-200/80">真實姓名 (允許同名)</label>
                                    <input type="text" id="reg-name" placeholder="請輸入真實姓名" class="w-full mt-1 px-4 py-2.5 glass-input rounded-xl text-sm outline-none transition">
                                </div>
                                <div>
                                    <label class="text-xs font-medium text-indigo-200/80">手機號碼 (唯一帳號)</label>
                                    <input type="tel" id="reg-phone" placeholder="09xxxxxxxx" class="w-full mt-1 px-4 py-2.5 glass-input rounded-xl text-sm outline-none transition">
                                </div>
                                <div>
                                    <label class="text-xs font-medium text-indigo-200/80">自訂密碼</label>
                                    <input type="password" id="reg-pwd" placeholder="設定密碼" class="w-full mt-1 px-4 py-2.5 glass-input rounded-xl text-sm outline-none transition">
                                </div>
                            </div>
                            <button onclick="handleRegister()" class="w-full btn-neon text-white py-3 rounded-xl font-medium text-sm transition">完成註冊並登入</button>
                            <p class="text-center text-xs text-indigo-200/60 mt-4">已經有帳號了？ <button onclick="switchAuthMode('login')" class="text-purple-400 font-medium">返回登入</button></p>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchAuthMode(mode) {
            document.getElementById('login-form').classList.toggle('hidden', mode === 'register');
            document.getElementById('register-form').classList.toggle('hidden', mode === 'login');
        }

        async function handleLogin() {
            const phone = document.getElementById('login-phone').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();

            const { data, error } = await _supabase
                .from('members')
                .select('*')
                .eq('phone', phone)
                .eq('pwd', pwd)
                .single();

            if (error || !data) {
                alert('帳號或密碼錯誤！');
                return;
            }

            currentUserPhone = phone;
            localStorage.setItem('sys_current_user', phone);
            render();
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const pwd = document.getElementById('reg-pwd').value.trim();

            if (!name || !phone || !pwd) {
                alert('請完整填寫所有欄位！');
                return;
            }

            const { data: existing } = await _supabase
                .from('members')
                .select('phone')
                .eq('phone', phone)
                .maybeSingle();

            if (existing) {
                alert('此手機號碼已經註冊過，一個手機號碼只能註冊一個帳號！');
                return;
            }

            const newMember = {
                phone: phone,
                name: name,
                pwd: pwd,
                balance: 0,
                points: 0,
                wallets: [{ type: 'topup', amount: 0, desc: '註冊成功開戶', time: new Date().toLocaleString() }],
                prizes: [],
                coupons: [{ id: Date.now(), title: '新會員好禮-30折價券', code: 'WELCOME30', status: 'unused', expire: '2026-12-31' }],
                cards: {}
            };

            const { error } = await _supabase.from('members').insert([newMember]);
            if (error) {
                alert('註冊失敗，請稍後再試');
                return;
            }

            currentUserPhone = phone;
            localStorage.setItem('sys_current_user', phone);
            alert('註冊成功！');
            render();
        }

        let activeTab = 'events';

        function renderMemberDashboard() {
            const user = currentMemberData;
            const wallets = user.wallets || [];
            const prizes = user.prizes || [];
            const coupons = user.coupons || [];
            const cards = user.cards || {};

            const pendingPrizes = prizes.map((p, idx) => ({ ...p, originalIndex: idx })).filter(p => p.status !== 'shipped' && p.status !== 'shipping');
            const historyPrizes = prizes.map((p, idx) => ({ ...p, originalIndex: idx })).filter(p => p.status === 'shipped' || p.status === 'shipping');

            return `
                <div class="bg-gradient-to-r from-purple-900/60 via-indigo-900/60 to-slate-900/80 p-5 rounded-b-3xl border-b border-purple-500/20 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <span class="text-xs text-purple-300/70">歡迎回來，VIP會員</span>
                            <h2 class="text-lg font-bold text-white neon-text-purple">${user.name} <span class="text-xs font-normal text-indigo-300">(${currentUserPhone})</span></h2>
                        </div>
                        <button onclick="handleLogout()" class="bg-white/10 hover:bg-white/20 text-xs px-3 py-1.5 rounded-xl border border-white/10 transition">登出</button>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-4">
                        <div class="bg-purple-950/40 p-3.5 rounded-2xl border border-purple-500/30">
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] text-purple-300/80">錢包餘額</span>
                                <button onclick="refreshBalance()" title="更新餘額" class="text-xs text-purple-300 hover:text-white transition">🔄</button>
                            </div>
                            <div class="text-xl font-bold mt-0.5 text-purple-200 neon-text-purple">NT$ ${user.balance.toLocaleString()}</div>
                        </div>
                        <div class="bg-indigo-950/40 p-3.5 rounded-2xl border border-indigo-500/30">
                            <span class="text-[11px] text-indigo-300/80">集點卡進度</span>
                            <div class="text-xl font-bold mt-0.5 text-cyan-300 neon-text-cyan">${user.points} / 10 點</div>
                        </div>
                    </div>
                </div>

                <div class="flex border-b border-white/10 bg-slate-950/40 text-xs font-medium">
                    <button onclick="switchMemberTab('events')" class="flex-1 py-3 text-center transition ${activeTab === 'events' ? 'text-pink-300 border-b-2 border-pink-500 font-bold bg-white/5' : 'text-slate-400'}">🔥 進行中活動</button>
                    <button onclick="switchMemberTab('prizes')" class="flex-1 py-3 text-center transition ${activeTab === 'prizes' ? 'text-purple-300 border-b-2 border-purple-500 font-bold bg-white/5' : 'text-slate-400'}">賞品櫃 (${pendingPrizes.length})</button>
                    <button onclick="switchMemberTab('wallet')" class="flex-1 py-3 text-center transition ${activeTab === 'wallet' ? 'text-purple-300 border-b-2 border-purple-500 font-bold bg-white/5' : 'text-slate-400'}">錢包明細</button>
                    <button onclick="switchMemberTab('coupons')" class="flex-1 py-3 text-center transition ${activeTab === 'coupons' ? 'text-purple-300 border-b-2 border-purple-500 font-bold bg-white/5' : 'text-slate-400'}">優惠與集點</button>
                </div>

                <div class="flex-1 p-4 overflow-y-auto max-h-[52vh]">
                    ${activeTab === 'events' ? renderEventsTab(cards) : ''}
                    ${activeTab === 'prizes' ? renderPrizesTab(pendingPrizes, historyPrizes) : ''}
                    ${activeTab === 'wallet' ? renderWalletTab(wallets) : ''}
                    ${activeTab === 'coupons' ? renderCouponsTab(coupons, user.points) : ''}
                </div>
            `;
        }

        async function refreshBalance() {
            await render();
        }

        function switchMemberTab(tab) {
            activeTab = tab;
            render();
        }

        function handleLogout() {
            currentUserPhone = null;
            currentMemberData = null;
            localStorage.removeItem('sys_current_user');
            render();
        }

        // 動態集字大挑戰
        function renderEventsTab(cards) {
            const cardEntries = Object.entries(cards).filter(([_, qty]) => qty > 0);
            const totalTypes = cardEntries.length;
            const totalQty = cardEntries.reduce((sum, [_, qty]) => sum + qty, 0);

            return `
                <div class="space-y-4">
                    <div class="bg-gradient-to-br from-pink-900/60 via-purple-900/60 to-indigo-900/80 p-4.5 rounded-3xl border border-pink-500/30 shadow-xl">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-[10px] bg-pink-500/30 text-pink-200 border border-pink-500/40 px-2.5 py-0.5 rounded-full font-bold">限時專屬活動</span>
                                <h3 class="text-base font-bold text-white mt-1.5 neon-text-purple">🔤 集字大挑戰</h3>
                            </div>
                            <span class="text-xs bg-white/10 text-pink-300 px-2.5 py-1 rounded-xl font-bold border border-white/10">進行中</span>
                        </div>
                        <p class="text-xs text-indigo-200/80 mb-4">收集指定字卡組合，集齊即可向官方人員申請兌換大獎！</p>

                        <!-- 字卡統計 -->
                        <div class="bg-black/30 p-3 rounded-2xl border border-white/10 mb-4 flex justify-around text-center">
                            <div>
                                <div class="text-[10px] text-purple-300">收集種類</div>
                                <div class="text-base font-bold text-white mt-0.5">${totalTypes} 種</div>
                            </div>
                            <div class="w-px bg-white/10"></div>
                            <div>
                                <div class="text-[10px] text-pink-300">字卡總數</div>
                                <div class="text-base font-bold text-pink-400 mt-0.5">${totalQty} 張</div>
                            </div>
                        </div>

                        <!-- 動態展示會員目前擁有的字卡 -->
                        <div class="grid grid-cols-3 gap-2.5">
                            ${totalTypes === 0 ? '<div class="col-span-3 text-center py-6 text-xs text-slate-400 bg-white/5 rounded-2xl border border-white/5">目前尚未獲得任何字卡，敬請期待活動發放！</div>' : ''}
                            ${cardEntries.map(([char, qty]) => `
                                <div class="p-3 rounded-2xl flex flex-col items-center justify-center border bg-gradient-to-b from-purple-600/40 to-pink-600/40 border-pink-400/50 shadow-lg shadow-pink-500/20">
                                    <div class="text-xl font-extrabold text-white neon-text-purple">${char}</div>
                                    <div class="text-[10px] mt-1 text-pink-300 font-bold">擁有 ${qty} 張</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWalletTab(wallets) {
            return `
                <div>
                    <h3 class="text-xs font-bold text-indigo-300/80 uppercase tracking-wider mb-3">歷史交易紀錄</h3>
                    <div class="space-y-2">
                        ${wallets.length === 0 ? '<p class="text-xs text-slate-500 text-center py-6">目前尚無交易紀錄</p>' : ''}
                        ${wallets.slice().reverse().map(w => `
                            <div class="bg-white/5 p-3 rounded-2xl flex justify-between items-center border border-white/5">
                                <div>
                                    <div class="text-xs font-bold text-slate-200">${w.desc}</div>
                                    <div class="text-[10px] text-slate-400 mt-0.5">${w.time}</div>
                                </div>
                                <div class="text-sm font-bold ${w.amount >= 0 ? 'text-emerald-400' : 'text-pink-400'}">
                                    ${w.amount >= 0 ? '+' : ''}${w.amount}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderPrizesTab(pendingPrizes, historyPrizes) {
            return `
                <div class="space-y-5">
                    <div>
                        <h3 class="text-xs font-bold text-indigo-300/80 uppercase tracking-wider mb-3 flex justify-between items-center">
                            <span>🎁 當前賞品 (待處理)</span>
                            <span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full font-normal">${pendingPrizes.length} 件</span>
                        </h3>
                        <div class="space-y-3">
                            ${pendingPrizes.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4 bg-white/5 rounded-2xl">目前無未寄送的賞品</p>' : ''}
                            ${pendingPrizes.map((p) => {
                                const hasShipping = !!p.shippingInfo;
                                return `
                                    <div class="bg-white/5 p-3.5 rounded-2xl border border-white/5 flex flex-col gap-2.5">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full font-medium border border-purple-500/30">獲得賞品</span>
                                                <div class="text-sm font-bold text-white mt-1.5">${p.name}</div>
                                                <div class="text-[10px] text-slate-400 mt-0.5">獲得時間: ${p.time}</div>
                                            </div>
                                            <div>
                                                <span class="text-xs px-3 py-1.5 rounded-xl font-bold ${hasShipping ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'}">
                                                    ${hasShipping ? '📝 已轉單' : '⏳ 待申請'}
                                                </span>
                                            </div>
                                        </div>
                                        
                                        ${hasShipping ? `
                                            <div class="bg-black/30 p-2.5 rounded-xl text-[11px] text-indigo-200/80 border border-white/5">
                                                <div class="font-bold text-purple-300 mb-0.5">轉單物流：${p.shippingInfo.method}</div>
                                                ${p.shippingInfo.method === '賣貨便' ? `單號: ${p.shippingInfo.code}` : ''}
                                                ${p.shippingInfo.method === '店到店' ? `收件人: ${p.shippingInfo.name} | 電話: ${p.shippingInfo.phone} \vert{} 門市: ${p.shippingInfo.branch}` : ''}
                                                ${p.shippingInfo.method === '宅配' ? `收件人: ${p.shippingInfo.name} | 電話: ${p.shippingInfo.phone} \vert{} 地址: ${p.shippingInfo.address}` : ''}
                                            </div>
                                        ` : ''}

                                        <div class="flex justify-end gap-2 pt-1">
                                            <button onclick="openShippingModal(${p.originalIndex}, '${p.name.replace(/'/g, "\\'")}')" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs px-3.5 py-1.5 rounded-xl font-bold shadow-md shadow-purple-500/20 transition">
                                                ${hasShipping ? '修改轉單資訊' : '📦 申請轉單'}
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="pt-2 border-t border-white/10">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex justify-between items-center">
                            <span>🚚 歷史寄送紀錄</span>
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-normal">${historyPrizes.length} 件</span>
                        </h3>
                        <div class="space-y-2">
                            ${historyPrizes.length === 0 ? '<p class="text-xs text-slate-500 text-center py-3">尚無已寄送的歷史紀錄</p>' : ''}
                            ${historyPrizes.map((p) => `
                                <div class="bg-white/5 p-3 rounded-2xl border border-white/5 opacity-70 flex justify-between items-center">
                                    <div>
                                        <div class="text-xs font-bold text-slate-300">${p.name}</div>
                                        <div class="text-[10px] text-slate-400 mt-0.5">獲得時間: ${p.time}</div>
                                    </div>
                                    <span class="text-[11px] bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-xl font-bold border border-emerald-500/30">
                                        📦 已出貨
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openShippingModal(prizeIdx, prizeName) {
            document.getElementById('modal-prize-index').value = prizeIdx;
            document.getElementById('modal-prize-title').innerText = `賞品：${prizeName}`;
            
            const prizes = currentMemberData.prizes || [];
            const p = prizes[prizeIdx];
            if (p && p.shippingInfo) {
                document.getElementById('shipping-method').value = p.shippingInfo.method;
                handleShippingMethodChange();
                if (p.shippingInfo.method === '賣貨便') {
                    document.getElementById('ship-c2c-code').value = p.shippingInfo.code || '';
                } else if (p.shippingInfo.method === '店到店') {
                    document.getElementById('ship-store-name').value = p.shippingInfo.name || '';
                    document.getElementById('ship-store-phone').value = p.shippingInfo.phone || '';
                    document.getElementById('ship-store-branch').value = p.shippingInfo.branch || '';
                } else if (p.shippingInfo.method === '宅配') {
                    document.getElementById('ship-home-name').value = p.shippingInfo.name || '';
                    document.getElementById('ship-home-phone').value = p.shippingInfo.phone || '';
                    document.getElementById('ship-home-address').value = p.shippingInfo.address || '';
                }
            } else {
                document.getElementById('shipping-method').value = '賣貨便';
                handleShippingMethodChange();
                document.getElementById('ship-c2c-code').value = '';
            }

            document.getElementById('shipping-modal').classList.remove('hidden');
        }

        function closeShippingModal() {
            document.getElementById('shipping-modal').classList.add('hidden');
        }

        function handleShippingMethodChange() {
            const method = document.getElementById('shipping-method').value;
            document.querySelectorAll('.shipping-fields').forEach(el => el.classList.add('hidden'));
            if (method === '賣貨便') {
                document.getElementById('field-c2c').classList.remove('hidden');
            } else if (method === '店到店') {
                document.getElementById('field-store').classList.remove('hidden');
            } else if (method === '宅配') {
                document.getElementById('field-home').classList.remove('hidden');
            }
        }

        async function submitShippingInfo() {
            const prizeIdx = parseInt(document.getElementById('modal-prize-index').value);
            const method = document.getElementById('shipping-method').value;
            
            let info = { method: method };

            if (method === '賣貨便') {
                const code = document.getElementById('ship-c2c-code').value.trim();
                if (!code) { alert('請填寫賣貨便單號！'); return; }
                info.code = code;
            } else if (method === '店到店') {
                const name = document.getElementById('ship-store-name').value.trim();
                const phone = document.getElementById('ship-store-phone').value.trim();
                const branch = document.getElementById('ship-store-branch').value.trim();
                if (!name || !phone || !branch) { alert('請完整填寫收件人姓名、電話與門市資訊！'); return; }
                info.name = name; info.phone = phone; info.branch = branch;
            } else if (method === '宅配') {
                const name = document.getElementById('ship-home-name').value.trim();
                const phone = document.getElementById('ship-home-phone').value.trim();
                const address = document.getElementById('ship-home-address').value.trim();
                if (!name || !phone || !address) { alert('請完整填寫收件人姓名、電話與宅配地址！'); return; }
                info.name = name; info.phone = phone; info.address = address;
            }

            const prizes = currentMemberData.prizes || [];
            if (prizes[prizeIdx]) {
                prizes[prizeIdx].shippingInfo = info;
            }

            const { error } = await _supabase
                .from('members')
                .update({ prizes: prizes })
                .eq('phone', currentUserPhone);

            if (error) {
                alert('轉單資訊送出失敗，請稍後再試');
                return;
            }

            alert('轉單物流資訊已成功送出！');
            closeShippingModal();
            render();
        }

        function renderCouponsTab(coupons, points) {
            return `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-purple-900/80 via-pink-900/80 to-indigo-900/80 text-white p-4 rounded-2xl border border-pink-500/30 shadow-lg">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-medium uppercase tracking-wider text-pink-200">VIP 專屬集點卡</span>
                            <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full">${points} / 10 點</span>
                        </div>
                        <div class="grid grid-cols-5 gap-2 mt-3">
                            ${Array.from({length: 10}).map((_, i) => `
                                <div class="h-9 rounded-xl flex items-center justify-center text-xs font-bold ${i < points ? 'bg-gradient-to-tr from-pink-500 to-purple-500 text-white shadow-md' : 'bg-black/30 text-slate-600'}">
                                    ${i < points ? '✦' : i + 1}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xs font-bold text-indigo-300/80 uppercase tracking-wider mb-2">我的優惠券</h3>
                        <div class="space-y-2">
                            ${coupons.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">目前沒有可用優惠券</p>' : ''}
                            ${coupons.map(c => `
                                <div class="bg-white/5 p-3 rounded-2xl border border-white/5 flex justify-between items-center">
                                    <div>
                                        <div class="text-xs font-bold text-slate-200">${c.title}</div>
                                        <div class="text-[10px] text-slate-400 mt-0.5">代碼: ${c.code} \vert{} 期限: ${c.expire}</div>
                                    </div>
                                    <div>
                                        ${c.status === 'unused' ? '<span class="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-xl font-medium">未使用</span>' : '<span class="text-xs bg-white/10 text-slate-400 px-2.5 py-1 rounded-xl font-medium">已使用</span>'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
