<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N7LiFe 官方後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; }
        .tab-btn { transition: all 0.2s ease; }
        .tab-active { background-color: #ffffff; color: #4f46e5; font-weight: 700; shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { color: #1e293b; background-color: rgba(255,255,255,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-4">

    <!-- 密碼登入驗證遮罩 -->
    <div id="login-box" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
        <div class="w-12 h-12 bg-rose-600 rounded-2xl mx-auto flex items-center justify-center text-white text-xl font-bold shadow-md mb-3">🛡️</div>
        <h3 class="text-lg font-bold text-slate-800 text-center mb-1">官方管理員驗證</h3>
        <p class="text-xs text-slate-400 text-center mb-5">請輸入您的專屬管理密碼以解鎖後台</p>
        <input type="password" id="admin-pwd" placeholder="請輸入管理密碼" class="w-full px-4 py-3 bg-slate-50 border rounded-2xl mb-4 text-sm outline-none focus:ring-2 focus:ring-rose-500">
        <button onclick="verifyPassword()" class="w-full bg-rose-600 text-white py-3 rounded-2xl text-sm font-bold shadow-lg hover:bg-rose-700 transition">解鎖管理後台</button>
    </div>

    <!-- 官方管理主介面 -->
    <div id="admin-panel" class="w-full max-w-md bg-white shadow-2xl rounded-3xl overflow-hidden flex flex-col h-[90vh] hidden relative">
        <div class="bg-slate-900 text-white p-4 flex justify-between items-center flex-shrink-0">
            <div>
                <span class="text-[10px] bg-rose-500 text-white px-2 py-0.5 rounded-full font-bold">官方管理後台</span>
                <h2 class="text-base font-bold mt-1">N7LiFe 管理系統 (雲端同步)</h2>
            </div>
            <div class="flex gap-2">
                <button onclick="loadAdminData()" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-xl transition flex items-center gap-1 font-bold">🔄 同步雲端</button>
                <button onclick="lockAdmin()" class="bg-slate-800 text-xs px-3 py-1.5 rounded-xl hover:bg-slate-700 transition">登出</button>
            </div>
        </div>

        <!-- 頂部頁籤分頁導覽 -->
        <div class="flex bg-slate-200/80 p-1.5 gap-1 border-b border-slate-200 text-xs font-medium flex-shrink-0">
            <button onclick="switchAdminTab('members')" id="tab-btn-members" class="tab-btn flex-1 py-2 text-center rounded-xl tab-active">👥 會員</button>
            <button onclick="switchAdminTab('shipping')" id="tab-btn-shipping" class="tab-btn flex-1 py-2 text-center rounded-xl tab-inactive">📦 出貨</button>
            <button onclick="switchAdminTab('wallet')" id="tab-btn-wallet" class="tab-btn flex-1 py-2 text-center rounded-xl tab-inactive">💰 異動</button>
            <button onclick="switchAdminTab('marketing')" id="tab-btn-marketing" class="tab-btn flex-1 py-2 text-center rounded-xl tab-inactive">🎟️ 券/卡</button>
        </div>

        <div class="flex-1 p-4 overflow-y-auto bg-slate-50">
            
            <!-- 分頁 1：會員總覽與管理 -->
            <div id="tab-content-members" class="space-y-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-slate-800">📋 已註冊會員總清單</h3>
                        <span id="member-count-badge" class="text-[10px] bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full font-bold">共 0 人</span>
                    </div>
                    <p class="text-[11px] text-slate-400 mb-3">可點擊「🔍 詳細狀態」檢視會員的錢包、賞品、折價券與字卡背包狀況。</p>
                    <div id="member-list-container" class="space-y-2 max-h-[62vh] overflow-y-auto pr-1"></div>
                </div>
            </div>

            <!-- 分頁 2：賞品出貨與轉單物流檢視 -->
            <div id="tab-content-shipping" class="space-y-4 hidden">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <div>
                        <h3 class="text-sm font-bold text-slate-800 mb-1 flex justify-between items-center">
                            <span>⏳ 待出貨 / 待處理賞品</span>
                            <span id="pending-count-badge" class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">0 件</span>
                        </h3>
                        <p class="text-[11px] text-slate-400 mb-2.5">點擊「完成寄送」將可把賞品歸類至歷史紀錄。</p>
                        <div id="admin-pending-prizes" class="space-y-2 max-h-[35vh] overflow-y-auto pr-1"></div>
                    </div>

                    <div class="pt-3 border-t border-slate-100">
                        <h3 class="text-xs font-bold text-slate-500 mb-2 flex justify-between items-center">
                            <span>📦 歷史紀錄 (已寄送 / 已回收)</span>
                            <span id="shipped-count-badge" class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">0 件</span>
                        </h3>
                        <div id="admin-shipped-prizes" class="space-y-2 max-h-[22vh] overflow-y-auto pr-1"></div>
                    </div>
                </div>
            </div>

            <!-- 分頁 3：錢包、賞品發放、集點卡異動 -->
            <div id="tab-content-wallet" class="space-y-4 hidden">
                <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl">
                    <label class="text-xs font-bold text-indigo-900 block mb-1">🎯 當前操作目標會員</label>
                    <select id="admin-target-phone" onchange="syncSelectedMember(this.value)" class="w-full px-3 py-2 bg-white border border-indigo-200 rounded-xl text-sm font-bold text-indigo-900 outline-none"></select>
                </div>

                <!-- 錢包加扣款 -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-800 mb-2.5">💰 錢包加扣款</h3>
                    <div class="space-y-2.5">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-500">金額 (+加款 / -扣款)</label>
                                <input type="number" id="admin-amount" placeholder="500 或 -200" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-500">異動說明</label>
                                <input type="text" id="admin-reason" placeholder="例如: 活動贈點" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                            </div>
                        </div>
                        <button onclick="adminAdjustWallet()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-indigo-700 transition">確認執行加扣款</button>
                    </div>
                </div>

                <!-- 發放賞品 (含回收換儲值金選項) -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-800 mb-2.5">🎁 發放賞品至會員賞品櫃</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-[11px] text-slate-500">賞品名稱</label>
                            <input type="text" id="admin-prize-name" placeholder="例如: A賞 - 終極限定公仔" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                        </div>

                        <!-- 回收設定選項 -->
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/60 space-y-2">
                            <div class="flex items-center justify-between">
                                <label class="text-xs font-bold text-slate-700">允許會員回收換儲值金？</label>
                                <select id="admin-prize-recyclable" onchange="toggleRecycleInput(this.value)" class="px-2 py-1 bg-white border rounded-lg text-xs font-bold outline-none">
                                    <option value="false">❌ 不可回收</option>
                                    <option value="true">✅ 允許回收</option>
                                </select>
                            </div>
                            <div id="recycle-amount-box" class="hidden">
                                <label class="text-[11px] text-slate-500">可回收折換儲值金額 (NT$)</label>
                                <input type="number" id="admin-prize-recycle-value" placeholder="例如: 300" value="0" class="w-full mt-1 px-3 py-1.5 bg-white border rounded-lg text-xs outline-none font-bold text-emerald-600">
                            </div>
                        </div>

                        <button onclick="adminIssuePrize()" class="w-full bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-emerald-700 transition">直接發放賞品</button>
                    </div>
                </div>

                <!-- 集點卡加點 -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-800 mb-2.5">✦ 集點卡調整</h3>
                    <div class="space-y-2.5">
                        <div>
                            <label class="text-[11px] text-slate-500">調整點數 (+1 或 -1)</label>
                            <input type="number" id="admin-point-val" value="1" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                        </div>
                        <button onclick="adminAdjustPoints()" class="w-full bg-amber-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-amber-700 transition">調整集點卡點數</button>
                    </div>
                </div>
            </div>

            <!-- 分頁 4：優惠券與集字卡發放專區 -->
            <div id="tab-content-marketing" class="space-y-4 hidden">
                <div class="bg-purple-50 border border-purple-100 p-3 rounded-2xl">
                    <label class="text-xs font-bold text-purple-900 block mb-1">🎯 當前派發目標會員</label>
                    <select id="admin-marketing-target-phone" onchange="syncSelectedMember(this.value)" class="w-full px-3 py-2 bg-white border border-purple-200 rounded-xl text-sm font-bold text-purple-900 outline-none"></select>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                    <div class="text-xs font-bold text-slate-800">⚡ 全體發送新會員折價券</div>
                    <p class="text-[11px] text-slate-400">點擊將發送「新會員好禮-30折價券 (WELCOME30)」給資料庫中全體會員。</p>
                    <button onclick="adminBatchIssueWelcomeCoupon()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-2 rounded-xl text-xs font-bold shadow-md hover:opacity-95 transition">⚡ 一鍵發送給所有會員</button>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
                    <div class="text-xs font-bold text-slate-800">🎟️ 單獨派發優惠券</div>
                    <div>
                        <label class="text-[11px] text-slate-500">優惠券名稱</label>
                        <input type="text" id="admin-coupon-title" placeholder="例如: 滿千折百折價券" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-slate-500">優惠代碼</label>
                            <input type="text" id="admin-coupon-code" placeholder="例如: SAVE100" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-500">有效期限</label>
                            <input type="date" id="admin-coupon-expire" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                        </div>
                    </div>
                    <button onclick="adminIssueCoupon()" class="w-full bg-purple-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-purple-700 transition">派發優惠券</button>
                </div>

                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
                    <div class="text-xs font-bold text-slate-800">🔤 發放集字卡專區</div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[11px] text-slate-500">字卡內容 (自行輸入)</label>
                            <input type="text" id="admin-card-char" placeholder="例如: N" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-500">發放數量</label>
                            <input type="number" id="admin-card-qty" value="1" min="1" class="w-full mt-1 px-3 py-2 bg-slate-50 border rounded-xl text-xs outline-none">
                        </div>
                    </div>
                    <button onclick="adminIssueCard()" class="w-full bg-pink-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-pink-700 transition">直接發放字卡</button>
                </div>
            </div>

        </div>
    </div>

    <!-- 會員詳細狀態檢視彈窗 Modal -->
    <div id="member-detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl relative max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <div>
                    <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">會員狀態總覽</span>
                    <h3 id="modal-user-name" class="text-base font-bold text-slate-800 mt-1"></h3>
                </div>
                <button onclick="closeMemberModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm">✕</button>
            </div>

            <div id="modal-detail-content" class="flex-1 overflow-y-auto py-4 space-y-4 text-xs"></div>

            <div class="pt-3 border-t border-slate-100">
                <button onclick="closeMemberModal()" class="w-full bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-slate-900 transition">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sanuaxbkzuvpgrfddodb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_9sgAfywutJsCQqyQWu9Thw_fL7WlEph';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allMembers = [];
        let currentlySelectedPhone = null;
        let activeAdminTab = 'members';

        function switchAdminTab(tabName) {
            activeAdminTab = tabName;
            const tabs = ['members', 'shipping', 'wallet', 'marketing'];
            
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                if (t === tabName) {
                    btn.className = "tab-btn flex-1 py-2 text-center rounded-xl tab-active";
                    content.classList.remove('hidden');
                } else {
                    btn.className = "tab-btn flex-1 py-2 text-center rounded-xl tab-inactive";
                    content.classList.add('hidden');
                }
            });
            // 每次切換分頁時自動重新整理雲端資料，確保數據同步
            loadAdminData();
        }

        function toggleRecycleInput(val) {
            const box = document.getElementById('recycle-amount-box');
            if (val === 'true') {
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        async function loadAdminData() {
            const { data, error } = await _supabase.from('members').select('*');
            if (error) {
                alert('無法載入雲端資料');
                return;
            }
            allMembers = data || [];

            const memberListContainer = document.getElementById('member-list-container');
            document.getElementById('member-count-badge').innerText = `共 ${allMembers.length} 人`;
            
            if (allMembers.length === 0) {
                memberListContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">目前尚無會員註冊</p>`;
            } else {
                memberListContainer.innerHTML = allMembers.map(u => `
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-slate-800">${u.name} <span class="text-slate-500 font-normal">(${u.phone})</span></div>
                            <div class="text-[10px] text-slate-400 mt-0.5">餘額: <span class="text-indigo-600 font-bold">$${u.balance.toLocaleString()}</span> | 點數: <span class="text-amber-600">${u.points}點</span></div>
                        </div>
                        <div class="flex gap-1.5">
                            <button onclick="viewMemberDetail('${u.phone}')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-2.5 py-1.5 rounded-xl font-bold transition text-[11px]">🔍 詳細狀態</button>
                            <button onclick="deleteMember('${u.phone}', '${u.name}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1.5 rounded-xl font-bold transition text-[11px]">刪除</button>
                        </div>
                    </div>
                `).join('');
            }

            const pendingContainer = document.getElementById('admin-pending-prizes');
            const shippedContainer = document.getElementById('admin-shipped-prizes');
            
            let pendingHtml = '';
            let shippedHtml = '';
            let pendingCount = 0;
            let shippedCount = 0;

            allMembers.forEach(u => {
                const userPrizes = u.prizes || [];
                userPrizes.forEach((p, pIdx) => {
                    const isDone = p.status === 'shipping' || p.status === 'shipped' || p.status === 'recycled';
                    const hasShipping = !!p.shippingInfo;

                    if (!isDone) {
                        pendingCount++;
                        pendingHtml += `
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex flex-col gap-2 text-xs">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <div class="font-bold text-slate-800 text-sm">${p.name}</div>
                                        <div class="text-[11px] text-slate-500 mt-0.5">會員: ${u.name} (${u.phone})</div>
                                        ${p.recyclable ? `<span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded mt-1 inline-block">可回收：$${p.recycleValue}</span>` : ''}
                                    </div>
                                    <div>
                                        <button onclick="togglePrizeStatus('${u.phone}', ${pIdx})" class="px-3 py-1.5 rounded-xl font-bold text-[11px] bg-amber-500 text-white hover:bg-amber-600 transition shadow-sm">
                                            🚚 完成寄送
                                        </button>
                                    </div>
                                </div>

                                ${hasShipping ? `
                                    <div class="bg-indigo-50/70 p-2.5 rounded-lg border border-indigo-100 text-[11px] text-slate-700">
                                        <span class="font-bold text-indigo-700">【會員轉單物流】</span> 方式：${p.shippingInfo.method}<br>${p.shippingInfo.method === '賣貨便' ? `單號: <span class="font-mono font-bold text-slate-900">${p.shippingInfo.code}</span>` : ''}
                                        ${p.shippingInfo.method === '店到店' ? `收件人: ${p.shippingInfo.name} | 電話: ${p.shippingInfo.phone} | 門市: ${p.shippingInfo.branch}` : ''}
                                        ${p.shippingInfo.method === '宅配' ? `收件人: ${p.shippingInfo.name} | 電話: ${p.shippingInfo.phone} | 地址: ${p.shippingInfo.address}` : ''}
                                    </div>
                                ` : '<div class="text-[10px] text-slate-400 italic">會員尚未申請轉單</div>'}
                            </div>
                        `;
                    } else {
                        shippedCount++;
                        shippedHtml += `
                            <div class="bg-slate-50/60 p-2.5 rounded-xl border border-slate-100 flex justify-between items-center text-xs opacity-75">
                                <div>
                                    <div class="font-bold text-slate-700">${p.name}</div>
                                    <div class="text-[10px] text-slate-400">會員: ${u.name} (${u.phone}) | 狀態: ${p.status === 'recycled' ? `♻️ 已回收 (+$${p.recycleValue || 0})` : '📦 已出貨'}</div>
                                </div>
                                <div>
                                    <button onclick="togglePrizeStatus('${u.phone}', ${pIdx})" class="px-2.5 py-1 rounded-lg text-[10px] bg-slate-200 text-slate-600 hover:bg-slate-300 transition">
                                        ↺ 復原狀態
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                });
            });

            document.getElementById('pending-count-badge').innerText = `${pendingCount} 件`;
            document.getElementById('shipped-count-badge').innerText = `${shippedCount} 件`;

            pendingContainer.innerHTML = pendingCount > 0 ? pendingHtml : `<p class="text-xs text-slate-400 text-center py-4 bg-slate-50/50 rounded-xl">尚無待處理賞品</p>`;
            shippedContainer.innerHTML = shippedCount > 0 ? shippedHtml : `<p class="text-xs text-slate-400 text-center py-3">無歷史紀錄</p>`;

            const optionsHtml = allMembers.map(u => `<option value="${u.phone}">${u.name} (${u.phone}) - 餘額: $${u.balance} / 點數: ${u.points}點</option>`).join('');
            
            document.getElementById('admin-target-phone').innerHTML = optionsHtml;
            document.getElementById('admin-marketing-target-phone').innerHTML = optionsHtml;

            if (currentlySelectedPhone && allMembers.some(u => u.phone === currentlySelectedPhone)) {
                syncSelectedMember(currentlySelectedPhone);
            } else if (allMembers.length > 0) {
                currentlySelectedPhone = allMembers[0].phone;
                syncSelectedMember(currentlySelectedPhone);
            }
        }

        function syncSelectedMember(phone) {
            currentlySelectedPhone = phone;
            const targetSel = document.getElementById('admin-target-phone');
            const mktSel = document.getElementById('admin-marketing-target-phone');
            if (targetSel) targetSel.value = phone;
            if (mktSel) mktSel.value = phone;
        }

        async function adminIssuePrize() {
            const phone = currentlySelectedPhone;
            const prizeName = document.getElementById('admin-prize-name').value.trim();
            const recyclable = document.getElementById('admin-prize-recyclable').value === 'true';
            const recycleValue = parseInt(document.getElementById('admin-prize-recycle-value').value) || 0;

            if (!prizeName) { alert('請輸入賞品名稱'); return; }

            const user = allMembers.find(u => u.phone === phone);
            if (!user) return;

            if (!user.prizes) user.prizes = [];
            user.prizes.push({
                id: Date.now(),
                name: prizeName,
                status: 'normal',
                time: new Date().toLocaleDateString(),
                recyclable: recyclable,
                recycleValue: recyclable ? recycleValue : 0
            });

            await _supabase.from('members').update({ prizes: user.prizes }).eq('phone', phone);
            
            document.getElementById('admin-prize-name').value = '';
            document.getElementById('admin-prize-recycle-value').value = '0';
            document.getElementById('admin-prize-recyclable').value = 'false';
            toggleRecycleInput('false');

            await loadAdminData();
            alert('賞品已成功發放！');
        }

        async function adminIssueCard() {
            const phone = currentlySelectedPhone;
            const char = document.getElementById('admin-card-char').value.trim();
            const qty = parseInt(document.getElementById('admin-card-qty').value) || 1;

            if (!char) { alert('請輸入字卡內容！'); return; }

            const user = allMembers.find(u => u.phone === phone);
            if (!user) return;

            let currentCards = user.cards || {};
            if (typeof currentCards !== 'object' || Array.isArray(currentCards)) {
                currentCards = {};
            }

            currentCards[char] = (currentCards[char] || 0) + qty;
            user.cards = currentCards;

            const { error } = await _supabase
                .from('members')
                .update({ cards: user.cards })
                .eq('phone', phone);

            if (error) {
                alert('字卡發放失敗！');
                return;
            }

            alert(`成功發放字卡 「${char}」 × ${qty} 給會員！`);
            document.getElementById('admin-card-char').value = '';
            await loadAdminData();
        }

        async function adminBatchIssueWelcomeCoupon() {
            if (!confirm(`確定要一鍵派發「新會員好禮-30折價券 (WELCOME30)」給全體 ${allMembers.length} 位會員嗎？`)) {
                return;
            }

            const newCoupon = {
                id: Date.now(),
                title: '新會員好禮-30折價券',
                code: 'WELCOME30',
                status: 'unused',
                expire: '2026-12-31'
            };

            for (let u of allMembers) {
                if (!u.coupons) u.coupons = [];
                const alreadyHas = u.coupons.some(c => c.code === 'WELCOME30');
                if (!alreadyHas) {
                    u.coupons.push(newCoupon);
                    await _supabase
                        .from('members')
                        .update({ coupons: u.coupons })
                        .eq('phone', u.phone);
                }
            }

            alert('已成功將「新會員好禮-30折價券」發送給所有會員！');
            await loadAdminData();
        }

        async function adminIssueCoupon() {
            const phone = currentlySelectedPhone;
            const title = document.getElementById('admin-coupon-title').value.trim();
            const code = document.getElementById('admin-coupon-code').value.trim();
            const expire = document.getElementById('admin-coupon-expire').value;

            if (!title || !code || !expire) {
                alert('請完整填寫優惠券名稱、代碼與有效期限！');
                return;
            }

            const user = allMembers.find(u => u.phone === phone);
            if (!user) return;

            if (!user.coupons) user.coupons = [];
            user.coupons.push({
                id: Date.now(),
                title: title,
                code: code,
                status: 'unused',
                expire: expire
            });

            const { error } = await _supabase
                .from('members')
                .update({ coupons: user.coupons })
                .eq('phone', phone);

            if (error) {
                alert('優惠券派發失敗，請稍後再試');
                return;
            }

            alert('優惠券已成功派發至該會員！');
            document.getElementById('admin-coupon-title').value = '';
            document.getElementById('admin-coupon-code').value = '';
            document.getElementById('admin-coupon-expire').value = '';
            await loadAdminData();
        }

        async function toggleCouponStatus(phone, couponId) {
            const user = allMembers.find(u => u.phone === phone);
            if (!user || !user.coupons) return;

            const coupon = user.coupons.find(c => c.id === couponId);
            if (!coupon) return;

            coupon.status = (coupon.status === 'unused') ? 'used' : 'unused';

            const { error } = await _supabase
                .from('members')
                .update({ coupons: user.coupons })
                .eq('phone', phone);

            if (error) {
                alert('更新核銷狀態失敗');
                return;
            }

            await loadAdminData();
            viewMemberDetail(phone);
        }

        function viewMemberDetail(phone) {
            const u = allMembers.find(item => item.phone === phone);
            if (!u) return;

            document.getElementById('modal-user-name').innerText = `${u.name} (${u.phone})`;

            const prizes = u.prizes || [];
            const coupons = u.coupons || [];
            const wallets = u.wallets || [];
            const cards = u.cards || {};

            const contentHtml = `
                <div class="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-100 text-center">
                    <div>
                        <div class="text-[10px] text-slate-400">錢包餘額</div>
                        <div class="text-sm font-bold text-indigo-600">NT$ ${u.balance.toLocaleString()}</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400">集點卡</div>
                        <div class="text-sm font-bold text-amber-600">${u.points} / 10 點</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-slate-400">帳號密碼</div>
                        <div class="text-xs font-mono font-bold text-slate-700">${u.pwd}</div>
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <h4 class="font-bold text-slate-700 mb-2">🔤 持有字卡背包</h4>
                    <div class="flex flex-wrap gap-1.5">
                        ${Object.keys(cards).length === 0 ? '<p class="text-[11px] text-slate-400 py-1">目前無任何字卡</p>' : ''}
                        ${Object.entries(cards).map(([char, qty]) => qty > 0 ? `
                            <span class="bg-pink-100 text-pink-700 text-[11px] px-2.5 py-1 rounded-xl font-bold border border-pink-200">
                                ${char} ×${qty}
                            </span>
                        ` : '').join('')}
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <h4 class="font-bold text-slate-700 mb-2 flex justify-between items-center">
                        <span>📦 賞品櫃清單</span>
                        <span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-normal">${prizes.length} 件</span>
                    </h4>
                    ${prizes.length === 0 ? '<p class="text-[11px] text-slate-400 text-center py-2">目前無任何賞品</p>' : ''}
                    <div class="space-y-1.5">
                        ${prizes.map(p => {
                            const isShipped = p.status === 'shipping' || p.status === 'shipped';
                            const isRecycled = p.status === 'recycled';
                            return `
                                <div class="bg-white p-2 rounded-xl border border-slate-100 flex justify-between items-center text-[11px]">
                                    <div>
                                        <div class="font-bold text-slate-800">${p.name}</div>
                                        <div class="text-[9px] text-slate-400">${p.time}${p.recyclable ? `| 可回收: $${p.recycleValue}` : ''}</div>
                                    </div>
                                    <span class="px-2 py-0.5 rounded font-bold ${isRecycled ? 'bg-amber-100 text-amber-700' : (isShipped ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-600')}">
                                        ${isRecycled ? `已回收 (+$${p.recycleValue || 0})` : (isShipped ? '已寄送' : (p.shippingInfo ? '已轉單' : '未寄送'))}
                                    </span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <h4 class="font-bold text-slate-700 mb-2 flex justify-between items-center">
                        <span>🎟️ 持有優惠券 (可點擊核銷)</span>
                        <span class="text-[10px] bg-pink-100 text-pink-700 px-2 py-0.5 rounded-full font-normal">${coupons.length} 張</span>
                    </h4>
                    ${coupons.length === 0 ? '<p class="text-[11px] text-slate-400 text-center py-2">無優惠券</p>' : ''}
                    <div class="space-y-1.5">
                        ${coupons.map(c => `
                            <div class="bg-white p-2.5 rounded-xl border border-slate-100 flex justify-between items-center text-[11px]">
                                <div>
                                    <div class="font-bold text-slate-800">${c.title}</div>
                                    <div class="text-[9px] text-slate-400">代碼: ${c.code} \vert{} 期限: ${c.expire}</div>
                                </div>
                                <button onclick="toggleCouponStatus('${u.phone}',${c.id})" class="px-2.5 py-1 rounded-lg font-bold transition ${c.status === 'unused' ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}">
                                    ${c.status === 'unused' ? '✓ 點擊核銷' : '↺ 取消核銷'}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <h4 class="font-bold text-slate-700 mb-2">💰 交易明細 (最新 5 筆)</h4>
                    ${wallets.length === 0 ? '<p class="text-[11px] text-slate-400 text-center py-2">無交易紀錄</p>' : ''}
                    <div class="space-y-1.5">
                        ${wallets.slice().reverse().slice(0, 5).map(w => `
                            <div class="bg-white p-2 rounded-xl border border-slate-100 flex justify-between items-center text-[11px]">
                                <div>
                                    <div class="font-medium text-slate-700">${w.desc}</div>
                                    <div class="text-[9px] text-slate-400">${w.time}</div>
                                </div>
                                <span class="font-bold ${w.amount >= 0 ? 'text-emerald-600' : 'text-rose-500'}">
                                    ${w.amount >= 0 ? '+' : ''}${w.amount}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('modal-detail-content').innerHTML = contentHtml;
            document.getElementById('member-detail-modal').classList.remove('hidden');
        }

        function closeMemberModal() {
            document.getElementById('member-detail-modal').classList.add('hidden');
        }

        async function deleteMember(phone, name) {
            if (!confirm(`確定要刪除會員 「${name} (${phone})」 嗎？此操作無法復原！`)) {
                return;
            }

            const { error } = await _supabase
                .from('members')
                .delete()
                .eq('phone', phone);

            if (error) {
                alert('刪除失敗，請稍後再試');
                return;
            }

            alert('已成功刪除該會員帳號！');
            await loadAdminData();
        }

        async function verifyPassword() {
            const pwd = document.getElementById('admin-pwd').value;
            if (pwd === 'admin888') {
                localStorage.setItem('sys_admin_unlocked', 'true');
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                await loadAdminData();
            } else {
                alert('管理密碼錯誤！');
            }
        }

        function lockAdmin() {
            localStorage.removeItem('sys_admin_unlocked');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('admin-pwd').value = '';
        }

        async function adminAdjustWallet() {
            const phone = currentlySelectedPhone;
            const amount = parseInt(document.getElementById('admin-amount').value);
            const reason = document.getElementById('admin-reason').value.trim() || '官方手動調整';

            if (isNaN(amount)) { alert('請輸入有效金額'); return; }

            const user = allMembers.find(u => u.phone === phone);
            if (!user) return;

            user.balance += amount;
            if (!user.wallets) user.wallets = [];
            user.wallets.push({ type: amount >= 0 ? 'topup' : 'spend', amount, desc: reason, time: new Date().toLocaleString() });

            await _supabase.from('members').update({ balance: user.balance, wallets: user.wallets }).eq('phone', phone);
            await loadAdminData();
            alert('加扣款成功！');
        }

        async function adminAdjustPoints() {
            const phone = currentlySelectedPhone;
            const val = parseInt(document.getElementById('admin-point-val').value);
            if (isNaN(val)) return;

            const user = allMembers.find(u => u.phone === phone);
            if (!user) return;

            user.points = Math.max(0, user.points + val);
            await _supabase.from('members').update({ points: user.points }).eq('phone', phone);
            await loadAdminData();
            alert('點數調整成功！');
        }

        async function togglePrizeStatus(phone, prizeIdx) {
            const user = allMembers.find(u => u.phone === phone);
            if (!user || !user.prizes[prizeIdx]) return;

            const currentStatus = user.prizes[prizeIdx].status;
            user.prizes[prizeIdx].status = (currentStatus === 'shipping' || currentStatus === 'shipped' || currentStatus === 'recycled') ? 'normal' : 'shipped';

            await _supabase.from('members').update({ prizes: user.prizes }).eq('phone', phone);
            await loadAdminData();
        }

        if (localStorage.getItem('sys_admin_unlocked') === 'true') {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            loadAdminData();
        }
    </script>
</body>
</html>
